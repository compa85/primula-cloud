---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: homarr
spec:
  retentionPolicy: "14d"
  configuration:
    destinationPath: ${CNPG_BACKUP_DESTINATION}
    endpointURL: ${CNPG_BACKUP_ENDPOINT}
    s3Credentials:
      accessKeyId:
        name: homarr-db-backup-secret
        key: access-key-id
      secretAccessKey:
        name: homarr-db-backup-secret
        key: access-secret-key
    data:
      compression: gzip
    wal:
      compression: gzip
      maxParallel: 2
