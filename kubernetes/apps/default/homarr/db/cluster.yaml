---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: homarr-db
spec:
  instances: 1
  storage:
    storageClass: longhorn-cnpg
    size: 2Gi
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required
    nodeSelector:
      storage: nvme
  bootstrap:
    initdb:
      database: homarr
      owner: homarr
  monitoring:
    enablePodMonitor: false
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: homarr
        serverName: homarr
