---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: n8n
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: n8n
  maxHistory: 3
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  uninstall:
    keepHistory: false
  values:
    image:
      repository: n8nio/n8n
      tag: 2.34.6
    main:
      config:
        n8n:
          editor_base_url: "https://n8n.${SECRET_DOMAIN}"
          email:
            mode: smtp
          smtp:
            sender: "n8n <noreply@${SECRET_DOMAIN}>"
            ssl: false
            starttls: true
        webhook_url: "https://n8n.${SECRET_DOMAIN}"
        generic:
          timezone: "${TIMEZONE}"
        tz: "${TIMEZONE}"
        db:
          type: postgresdb
          postgresdb:
            host: n8n-db-rw
            user: n8n
            pool:
              size: 10
            ssl:
              enabled: true
              reject_Unauthorized: true
              ca_file: "/home/ssl/certs/postgresql/ca.crt"
      extraEnv:
        N8N_ENCRYPTION_KEY:
          valueFrom:
            secretKeyRef:
              name: n8n-secret
              key: encryption-key
        DB_POSTGRESDB_PASSWORD:
          valueFrom:
            secretKeyRef:
              name: n8n-db-app
              key: password
        N8N_SMTP_HOST:
          valueFrom:
            secretKeyRef:
              name: &smtp-secret n8n-smtp-secret
              key: host
        N8N_SMTP_PORT:
          valueFrom:
            secretKeyRef:
              name: *smtp-secret
              key: port
        N8N_SMTP_USER:
          valueFrom:
            secretKeyRef:
              name: *smtp-secret
              key: username
        N8N_SMTP_PASS:
          valueFrom:
            secretKeyRef:
              name: *smtp-secret
              key: password
      extraVolumeMounts:
        - name: n8n-db-ca-cert
          mountPath: /home/ssl/certs/postgresql
          readOnly: true

      extraVolumes:
        - name: n8n-db-ca-cert
          secret:
            secretName: n8n-db-ca
            items:
              - key: ca.crt
                path: ca.crt
    ingress:
      enabled: true
      annotations:
        external-dns.alpha.kubernetes.io/target: "external.${SECRET_DOMAIN}"
        kubernetes.io/ingress.class: traefik-external
      hosts:
        - host: n8n.${SECRET_DOMAIN}
          paths:
            - path: /
              pathType: Prefix
      tls:
        - hosts:
            - n8n.${SECRET_DOMAIN}
