---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-oauth
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: immich-oauth-secret
    creationPolicy: Owner
  data:
    - secretKey: oidc-client-id
      remoteRef:
        key: immich/oidc-client-id
    - secretKey: oidc-client-secret
      remoteRef:
        key: immich/oidc-client-secret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-smtp
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: immich-smtp-secret
    creationPolicy: Owner
  data:
    - secretKey: host
      remoteRef:
        key: smtp/host
    - secretKey: port
      remoteRef:
        key: smtp/port
    - secretKey: username
      remoteRef:
        key: smtp/username
    - secretKey: password
      remoteRef:
        key: smtp/password
