---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudflared
spec:
  chart:
    spec:
      chart: cloudflared
      version: 2.2.16
      sourceRef:
        kind: HelmRepository
        name: cloudflared
  interval: 1h
  maxHistory: 3
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  uninstall:
    keepHistory: false
  values:
    replica:
      allNodes: false
      count: 2
    image:
      repository: docker.io/cloudflare/cloudflared
      tag: 2026.8.2
    tunnelConfig:
      name: "K3S"
    tunnelSecrets:
      existingPemFileSecret:
        name: "cloudflared-secret"
        key: "cert"
      existingConfigJsonFileSecret:
        name: "cloudflared-secret"
        key: "credentials"
    ingress:
      - hostname: ${SECRET_DOMAIN}
        service: &svc https://traefik-external.network.svc.cluster.local:443
        originRequest:
          originServerName: "external.${SECRET_DOMAIN}"
      - hostname: "*.${SECRET_DOMAIN}"
        originRequest:
          originServerName: "external.${SECRET_DOMAIN}"
        service: *svc
      - service: http_status:404
