apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: primula-cloud-production-issuer
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@${SECRET_DOMAIN}
    privateKeySecretRef:
      name: primula-cloud-production-key
    solvers:
      - dns01:
          cloudflare:
            email: admin@${SECRET_DOMAIN}
            apiTokenSecretRef:
              name: cert-manager-primula-cloud-secret
              key: apiToken
        selector:
          dnsZones:
            - "${SECRET_DOMAIN}"
