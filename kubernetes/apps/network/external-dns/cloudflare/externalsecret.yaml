---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: external-dns-cloudflare
  namespace: network
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: external-dns-cloudflare-secret
    creationPolicy: Owner
    template:
      data:
        apiToken: "{{ .token }}"
  data:
    - secretKey: token
      remoteRef:
        key: cloudflare/token
