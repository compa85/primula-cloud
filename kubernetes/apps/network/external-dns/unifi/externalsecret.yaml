---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: external-dns-unifi
  namespace: network
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: external-dns-unifi-secret
    creationPolicy: Owner
  data:
    - secretKey: host
      remoteRef:
        key: unifi/host
    - secretKey: api-key
      remoteRef:
        key: unifi/api-key
